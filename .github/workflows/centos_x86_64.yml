name: centos x86_64
jobs:
  centos_x86_64_images:
    runs-on: ubuntu-latest
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: 'set -euo pipefail

        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused
        "https://raw.githubusercontent.com/oneclickvirt/lxc_amd64_images/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"

        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused
        "https://raw.githubusercontent.com/oneclickvirt/lxc_amd64_images/main/.github/scripts/release_assets.py" -o "$RUNNER_TEMP/ci-release-assets.py"

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup verified builder Go toolchain
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.26.5
        cache: false
    - name: Install compatible verified image builder
      shell: bash
      run: bash .github/scripts/install_distrobuilder.sh
    - name: Validate image definitions
      shell: bash
      run: 'set -euo pipefail

        python3 -m venv "$RUNNER_TEMP/image-definition-check"

        "$RUNNER_TEMP/image-definition-check/bin/python" -m pip install --disable-pip-version-check --retries 3 --timeout
        30 PyYAML==6.0.3

        "$RUNNER_TEMP/image-definition-check/bin/python" .github/scripts/verify_image_definitions.py

        '
    - name: check path
      run: 'pwd

        '
    - name: Configure Git
      run: 'git config --global user.name "daily-update"

        git config --global user.email "tg@spiritlhl.top"

        '
    - name: Build and Upload Images
      run: "source \"$RUNNER_TEMP/ci-network.sh\"\nset -euo pipefail\ndistros=(\"centos\")\nARCH=x86_64\nfor distro in \"\
        ${distros[@]}\"; do\n  output=$(bash build_images.sh \"$distro\" false \"$ARCH\" | tail -n 1)\n  read -r -a assets\
        \ <<< \"$output\"\n  [[ ${#assets[@]} -gt 0 ]] || { echo \"No configured image outputs.\" >&2; exit 1; }\n  bash -c\
        \ 'source \"$1\"; export -f ci_retry gh git ci_clone_attempt curl wget; bash \"$2\" \"$3\" true \"$4\"' -- \"$RUNNER_TEMP/ci-network.sh\"\
        \ \"build_images.sh\" \"$distro\" \"$ARCH\"\n  python3 .github/scripts/verify_image_outputs.py \"${assets[@]}\"\n\
        \  python3 \"$RUNNER_TEMP/ci-release-assets.py\" \"$distro\" \"${assets[@]}\"\n  rm -f \"${assets[@]}\"\ndone\n"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CI_IMAGE_RELEASES: ${{ github.event_name == 'schedule' && '9-Stream' || inputs.release }}
    timeout-minutes: 180
'on':
  schedule:
  - cron: 0 13 * * *
  workflow_dispatch:
    inputs:
      release:
        description: Build only this configured release; empty selects the catalog
        required: false
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: image-publish-centos_x86_64
  cancel-in-progress: false

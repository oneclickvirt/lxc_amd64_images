name: gentoo x86_64
'on':
  schedule:
  - cron: 30 11 * * *
  workflow_dispatch:
    inputs:
      release:
        description: Build only this configured release; empty selects the catalog
        required: false
        type: string
        default: ''
      variant:
        description: Variant to rebuild; automatic runs use cloud
        type: choice
        required: true
        default: cloud
        options:
        - cloud
        - openrc
        - systemd
        - all
permissions:
  contents: write
jobs:
  validated-build:
    uses: ./.github/workflows/hosted-build.yml
    with:
      distro: gentoo
      arch: amd64
      kind: container
      scope: current
      release: ${{ inputs.release || '' }}
      variant: ${{ inputs.variant }}

name: openwrt x86_64
'on':
  schedule:
  - cron: 0 10 * * *
  workflow_dispatch:
    inputs:
      release:
        description: Exact stable line or snapshot; automatic runs use 25.12
        required: false
        type: string
        default: '25.12'
permissions:
  contents: write
jobs:
  validated-build:
    uses: ./.github/workflows/hosted-build.yml
    with:
      distro: openwrt
      arch: amd64
      kind: container
      scope: current
      release: ${{ inputs.release || '' }}

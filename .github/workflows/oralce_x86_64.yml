name: oracle x86_64
'on':
  schedule:
  - cron: 0 9 * * *
  workflow_dispatch:
    inputs:
      release:
        description: Exact release; empty uses the verified automatic catalog (8/9)
        required: false
        type: string
        default: ''
permissions:
  contents: write
jobs:
  validated-build:
    uses: ./.github/workflows/hosted-build.yml
    with:
      distro: oracle
      arch: amd64
      kind: container
      scope: current
      release: ${{ inputs.release || '' }}

name: almalinux x86_64
'on':
  schedule:
  - cron: 0 16 * * *
  workflow_dispatch:
    inputs:
      release:
        description: Build only this configured release; empty selects the catalog
        required: false
        type: string
        default: ''
permissions:
  contents: write
jobs:
  validated-build:
    uses: ./.github/workflows/hosted-build.yml
    with:
      distro: almalinux
      arch: amd64
      kind: container
      scope: current
      release: ${{ inputs.release || '' }}

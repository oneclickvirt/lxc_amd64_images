name: clone yaml
jobs:
  clone_yaml:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Prepare definition validation
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/image-definition-check"
        "$RUNNER_TEMP/image-definition-check/bin/python" -m pip install --disable-pip-version-check --retries 3 --timeout 30 PyYAML==6.0.3
        "$RUNNER_TEMP/image-definition-check/bin/python" .github/scripts/verify_image_definitions.py
    - name: Refresh sources with validated fallback
      shell: bash
      run: bash clone_modify_yaml.sh
      env:
        GH_TOKEN: ${{ github.token }}
        CI_IMAGE_PYTHON: ${{ runner.temp }}/image-definition-check/bin/python
    - name: Commit validated source snapshot
      if: github.event_name != 'workflow_dispatch' || inputs.publish
      shell: bash
      run: |-
        set -euo pipefail
        # shellcheck source=.github/scripts/ci_network.sh
        source .github/scripts/ci_network.sh
        git config user.name "daily-update"
        git config user.email "tg@spiritlhl.top"
        git add images_yaml -- *_images.txt .github/image-catalog.json
        if git diff --cached --quiet; then
          echo "No new source snapshot to commit."
          exit 0
        fi
        rebuild=false
        if ! git diff --cached --quiet -- 'images_yaml/*.yaml' .github/image-catalog.json; then
          rebuild=true
        fi
        git commit -m "Update validated image definitions and release indexes"
        "$RUNNER_TEMP/image-definition-check/bin/python" .github/scripts/push_image_snapshot.py --branch "$GITHUB_REF_NAME"
        if [[ "$rebuild" != true || "$BUILD_IMAGES" != true ]]; then
          echo "Validated source snapshot committed; no duplicate image build requested."
          exit 0
        fi
        ci_retry gh workflow run hosted-build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
          --field distro=all --field arch=amd64 --field scope=current --field kind=container
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_IMAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.rebuild }}
    timeout-minutes: 15
'on':
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      publish:
        description: Commit validated upstream definitions and release indexes
        type: boolean
        default: true
      rebuild:
        description: Build images when definitions or the build catalog change
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
concurrency:
  group: image-source-refresh
  cancel-in-progress: false
